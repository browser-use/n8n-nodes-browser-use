name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push supersedes in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Floor from package.json engines, plus the current LTS and the version
        # the publish workflow releases from.
        node-version: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node so the pnpm store path can be resolved for caching.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
